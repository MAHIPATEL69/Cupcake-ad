<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blush Berry Cupcake</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        <div class="banner-bg">
            <h1 class="bg-text">CUPCAKE</h1>
        </div>

        <div class="cupcake-image">
            <img src="images.png" alt="Blush Berry Cupcake">
        </div>
        <div class="content-section">
            <h2 class="brand-title">BLUSH BERRY</h2>
            <h3 class="subtitle">Sweet & Fluffy</h3>
            <p class="description">
                Soft, fluffy and beautiful frosted in dreamy pink swirls- this cupcake is the perfect blend of sweetness and elegance...
            </p>
            <div class="price">$ 300</div>
            <button class="shop-btn">Shop Now</button>
        </div>
    </div>

</body>
</html>
